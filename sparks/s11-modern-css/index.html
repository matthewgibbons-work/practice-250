<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tells the browser before the CSS loads, so a dark phone never flashes white -->
  <meta name="color-scheme" content="light dark">
  <title>December Sky Checklist — Astronomy Club</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>December Sky Checklist</h1>
    <p class="intro">Our first night out. Tick each one off when you spot it. Turn your phone to dark mode to protect your night vision.</p>
  </header>

  <main>
    <fieldset>
      <legend>Five things to find</legend>
      <ul class="checklist">
        <li>
          <input type="checkbox" id="orion">
          <label for="orion">
            <span class="name">Orion</span>
            <span class="hint">Three stars in a row (the Belt), rising in the east after about 8 p.m.</span>
          </label>
        </li>
        <li>
          <input type="checkbox" id="pleiades">
          <label for="pleiades">
            <span class="name">The Pleiades</span>
            <span class="hint">A tiny, dipper-shaped cluster high in the east in the early evening.</span>
          </label>
        </li>
        <li>
          <input type="checkbox" id="jupiter">
          <label for="jupiter">
            <span class="name">Jupiter</span>
            <span class="hint">A bright "star" that doesn't twinkle. Check a sky app for where it is tonight.</span>
          </label>
        </li>
        <li>
          <input type="checkbox" id="geminids">
          <label for="geminids">
            <span class="name">A Geminid meteor</span>
            <span class="hint">Peaks December 13–14. Look anywhere overhead after 10 p.m.</span>
          </label>
        </li>
        <li>
          <input type="checkbox" id="andromeda">
          <label for="andromeda">
            <span class="name">The Andromeda Galaxy</span>
            <span class="hint">A faint, fuzzy smudge high overhead early in the evening. Binoculars help.</span>
          </label>
        </li>
      </ul>
    </fieldset>
  </main>

  <footer>
    <p><a href="../../">Back to my DIGHT 250 hub</a></p>
  </footer>
</body>
</html>
